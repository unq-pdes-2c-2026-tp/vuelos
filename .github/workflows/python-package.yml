# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: vuelos-ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

defaults:
  run:
    working-directory: ./
jobs:

  run_pre_commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pre-commit
        run: pre-commit run --all-files

  django_checks:
    runs-on: ubuntu-latest
    env:
      MYSQL_VUELOS_ROOT_PASSWORD: pwdvuelosroot
      MYSQL_VUELOS_DATABASE: vuelos
      MYSQL_VUELOS_USER: vuelos
      MYSQL_VUELOS_PASSWORD: vuelos
      MYSQL_VUELOS_PORT: 3307
      DJANGO_VUELOS_SECRET_KEY: "super-secret-key"
      DJANGO_VUELOS_SETTINGS_MODULE: "vuelos_proj.settings.production"
      DJANGO_VUELOS_PORT: 4001

    steps:
    - uses: actions/checkout@v4
    - name: Start Docker Compose services
      run: docker compose up -d --build db_vuelos
    - name: Run django checks
      run: docker compose run --rm --no-deps --build vuelos python manage.py check --fail-level=WARNING
    - name: Check missing migrations
      run: docker compose run --rm --no-deps --build vuelos python manage.py makemigrations --dry-run --check --no-input

  test:

    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_DATABASE: vuelos
          MYSQL_USER: vuelos_django
          MYSQL_PASSWORD: vuelos_django
          MYSQL_ROOT_PASSWORD: vuelos_django
        ports:
          - 3306:3306
        # Ensure the runner waits until MySQL is fully initialized before starting steps
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install coverage

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests and generate coverage
      env:
        DJANGO_SETTINGS_MODULE: ctv.settings.ci
      run: |
        coverage run --source=. -m pytest
        coverage report
        coverage xml

    - name: SonarQube Cloud Scan
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >-
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.sources=.
          -Dsonar.exclusions=.github/**,**/migrations/**,**/tests/**,**/test_*.py,**/*_test.py,**/.venv/**,**/venv/**,**/__pycache__/**,**/media/**
          -Dsonar.tests=.
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.test.inclusions=**/tests.py,**/test_*.py,**/*_tests.py
          -Dsonar.python.version=3.10
