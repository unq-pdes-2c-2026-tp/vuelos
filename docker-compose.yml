services:

  db_vuelos:
    image: mysql:latest
    restart: always
    ports:
      - "${MYSQL_VUELOS_PORT}:${MYSQL_VUELOS_PORT}"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_VUELOS_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_VUELOS_DATABASE}
      MYSQL_USER: ${MYSQL_VUELOS_USER}
      MYSQL_PASSWORD: ${MYSQL_VUELOS_PASSWORD}
      MYSQL_TCP_PORT: ${MYSQL_VUELOS_PORT}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pvuelos_django" ]
      interval: 5s
      timeout: 5s
      retries: 10

  vuelos:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:${DJANGO_VUELOS_PORT}"
    ports:
      - "${DJANGO_VUELOS_PORT}:${DJANGO_VUELOS_PORT}"
    volumes:
      - ./media:/app/media
    environment:
      - DB_HOST=db_vuelos
      - DB_NAME=${MYSQL_VUELOS_DATABASE}
      - DB_USER=${MYSQL_VUELOS_USER}
      - DB_PASSWORD=${MYSQL_VUELOS_PASSWORD}
      - DB_PORT=${MYSQL_VUELOS_PORT}
      - DJANGO_SECRET_KEY=${DJANGO_VUELOS_SECRET_KEY}
      - DJANGO_SETTINGS_MODULE=${DJANGO_VUELOS_SETTINGS_MODULE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db_vuelos:
          condition: service_healthy

volumes:
  mysql_data:
