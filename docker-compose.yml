services:
  db:
    image: mysql:latest
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: vuelos_django
      MYSQL_DATABASE: vuelos
      MYSQL_USER: vuelos_django
      MYSQL_PASSWORD: vuelos_django
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
